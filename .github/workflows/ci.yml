name: CI/CD

# test runs on every PR and every push to main (the merge gate).
# deploy runs ONLY on a push to main, and ONLY after test passes.
# The `production` environment lets you add a required reviewer in
# repo Settings > Environments so deploys pause for manual approval
# (CI-green + PR review then replace the old "verify on localhost first" step).
on:
  pull_request:
  push:
    branches: [main]

# One push to main at a time: a newer push cancels the older push's run, so the last
# commit merged is the one deployed. (On 7 Nov two merges deployed at once and the older
# commit finished last, overwriting the newer one.) Cancelling is safe: Cloudflare only
# switches to a new version once its upload completes. PR runs each get their own group.
concurrency:
  group: ${{ github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Format check
        run: pnpm dlx prettier@3 --check "src/**/*.ts" "test/**/*.ts"

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/worker
